apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata: {name: api}
    spec:
      selector: {app: api}
      ports: [{name: http, port: 8000, targetPort: http}]
  - apiVersion: v1
    kind: Service
    metadata: {name: web}
    spec:
      selector: {app: web}
      ports: [{name: http, port: 3000, targetPort: http}]
  - apiVersion: v1
    kind: Service
    metadata: {name: gateway}
    spec:
      selector: {app: gateway}
      ports: [{name: http, port: 8080, targetPort: http}]
