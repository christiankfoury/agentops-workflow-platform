apiVersion: v1
kind: Namespace
metadata:
  name: agentops
  labels:
    app.kubernetes.io/part-of: agentops
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime
data:
  ENVIRONMENT: production
  IDENTITY_ENABLED: "true"
  DATABASE_URL_FILE: /run/database/database_url
  TRUSTED_HOSTS: '["api","localhost","127.0.0.1"]'
  PGCONNECT_TIMEOUT: "3"
  DB_POOL_SIZE: "4"
  DB_MAX_OVERFLOW: "4"
  WORKER_CONCURRENCY: "2"
  WORKER_LEASE_SECONDS: "30"
  WORKER_HEARTBEAT_SECONDS: "5"
  API_INTERNAL_URL: http://api:8000
  APP_ORIGIN: https://app.example.invalid
  OIDC_ISSUER: https://identity.example.invalid
  OIDC_AUDIENCE: configure-client-id
  OIDC_CLIENT_ID: configure-client-id
  OIDC_JWKS_URL: https://identity.example.invalid/jwks
  OIDC_AUTHORIZE_URL: https://identity.example.invalid/authorize
  OIDC_TOKEN_URL: https://identity.example.invalid/token
  OIDC_CLIENT_SECRET_FILE: /run/identity/oidc_client_secret
  OPENAI_API_KEY: ""
  TOOL_CREDENTIAL_VALUES: '{}'
  HTTP_TOOL_DESTINATIONS: '{}'
  POSTGRES_TOOL_CONNECTIONS: '{}'
  GITHUB_TOOL_REPOSITORIES: '{}'
  WEBHOOK_SECRET_VALUES: '{}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway
data:
  Caddyfile: |
    {
      admin off
      auto_https off
      servers {
        protocols h1 h2
      }
    }
    :8081 {
      respond /health "ok" 200
    }
    :8080 {
      @untrusted not host {$PUBLIC_HOST}
      route {
        respond @untrusted "Untrusted host" 421
        handle_path /api/* {
          reverse_proxy api:8000 {
            header_up Host api
          }
        }
        handle {
          reverse_proxy web:3000
        }
      }
    }
