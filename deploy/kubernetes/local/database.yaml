apiVersion: v1
kind: Service
metadata: {name: db, namespace: agentops}
spec:
  clusterIP: None
  selector: {app: db}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: agentops}
spec:
  serviceName: db
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      serviceAccountName: runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: db
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: agentops}
            - {name: POSTGRES_DB, value: agentops}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/database/password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: database, mountPath: /run/database, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: shm, mountPath: /dev/shm}
          startupProbe:
            exec: {command: [pg_isready, -U, agentops, -d, agentops]}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec: {command: [pg_isready, -U, agentops, -d, agentops]}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec: {command: [pg_isready, -U, agentops, -d, agentops]}
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: database
          secret:
            secretName: database
            items: [{key: password, path: password}]
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: socket, emptyDir: {sizeLimit: 32Mi}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
