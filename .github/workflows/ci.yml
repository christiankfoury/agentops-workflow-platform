name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phase_test
          POSTGRES_PASSWORD: phase_test_local
          POSTGRES_DB: phase_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase_test -d phase_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://phase_test:phase_test_local@localhost:5432/phase_validation
      WORKFLOW_TEST_DATABASE_URL: postgresql://phase_test:phase_test_local@localhost:5432/phase_validation
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Migrate fresh PostgreSQL database
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

      - name: Audit dependencies
        run: uv run pip-audit

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/web lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Smoke tests
        run: pnpm --dir apps/web test:smoke

      - name: Production build
        run: pnpm --dir apps/web build

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate development Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Validate production and isolated verification configuration
        env:
          SECRET_DIR: /tmp/agentops-placeholder-secrets
          APP_ORIGIN: https://localhost:8443
          OIDC_ISSUER: https://localhost:8443/oidc
          OIDC_CLIENT_ID: agentops-verification
          OIDC_JWKS_URL: https://gateway:8443/oidc/jwks
          OIDC_AUTHORIZE_URL: https://localhost:8443/oidc/authorize
          OIDC_TOKEN_URL: https://gateway:8443/oidc/token
        run: |
          docker compose -f deploy/compose.production.yml config --quiet
          docker compose -f deploy/compose.production.yml -f deploy/compose.verification.yml config --quiet
